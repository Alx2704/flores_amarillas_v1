<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti... Flores Amarillas</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2c221a 0%, #110c08 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Partículas de polvo brillante del fondo */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .dust {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.3);
            animation: floatUp 12s infinite linear, twinkle 3s infinite ease-in-out;
        }

        .sparkle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 5px #fff, 0 0 10px #FFD700;
            animation: blink 4s infinite alternate;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; scale: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes blink {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Textos superiores */
        .header {
            text-align: center;
            margin-top: 6vh;
            z-index: 10;
        }

        .title {
            font-family: 'Caveat', cursive;
            color: #FFD700;
            font-size: 3.8rem;
            margin: 0;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }

        .subtitle {
            color: #dcdcdc;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            margin-top: 8px;
            text-transform: uppercase;
            font-weight: 500;
            transition: color 0.5s;
        }

        /* Estilo para el mensaje bonito */
        .pretty-message {
            text-transform: none !important;
            font-size: 1.1rem; 
            color: #dcdcdc; 
        }

        /* Contenedor del frasco */
        .jar-container {
            position: relative;
            margin-top: 5vh;
            width: 260px;
            height: 380px;
            z-index: 5;
        }

        .glow-bg {
            position: absolute;
            top: 5%;
            left: -10%;
            width: 120%;
            height: 90%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0) 70%);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        .glow-bg.show {
            opacity: 1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* Dibujo del frasco */
        .jar {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-radius: 0 0 25px 25px;
            box-sizing: border-box;
            z-index: 2;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .jar::before, .jar::after {
            content: '';
            position: absolute;
            top: 30px;
            bottom: 25px;
            width: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
        }
        .jar::before { left: 12px; }
        .jar::after { right: 12px; }

        .jar-top {
            position: absolute;
            top: -15px;
            left: -4px;
            width: 268px;
            height: 35px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 4;
            background: rgba(255,255,255,0.01);
            pointer-events: none;
        }

        .jar-inside {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0 0 22px 22px;
            overflow: hidden;
            z-index: 1;
        }

        .flower {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            pointer-events: none;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4));
            will-change: transform;
            transform-origin: center center;
        }

        /* Tarjeta de Mensaje */
        .note {
            position: absolute;
            top: 45%;
            left: 50%;
            width: 280px;
            background: #ffffff;
            border: 6px solid #FFC107;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(255, 193, 7, 0.4);
            z-index: 20;
            
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .note.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .note h2 {
            font-family: 'Caveat', cursive;
            color: #d81b60;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            line-height: 1;
        }

        .note p {
            color: #2c3e50;
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Fondo -->
    <div class="particles" id="particles"></div>

    <!-- Títulos -->
    <div class="header">
        <h1 class="title">Para ti...</h1>
        <p class="subtitle pretty-message" id="instruction">UN TARRO LLENO DE AMOR...</p>
    </div>

    <!-- Frasco y Tarjeta -->
    <div class="jar-container" id="jarContainer">
        <div class="glow-bg" id="glow"></div>
        <div class="jar-top"></div>
        <div class="jar"></div>
        <div class="jar-inside" id="jarInside"></div>
        
        <div class="note" id="noteCard">
            <h2>Sorpresa!</h2>
            <p>Cada flor representa un <br>motivo por el que te quiero.<br>¡Gracias por estar en mi vida!</p>
        </div>
    </div>

    <script>
        const flowerSVGs = [
            `<svg viewBox="0 0 100 100"><g fill="#FFD700"><circle cx="50" cy="20" r="16"/><circle cx="50" cy="80" r="16"/><circle cx="20" cy="50" r="16"/><circle cx="80" cy="50" r="16"/><circle cx="28" cy="28" r="16"/><circle cx="72" cy="72" r="16"/><circle cx="28" cy="72" r="16"/><circle cx="72" cy="28" r="16"/></g><circle cx="50" cy="50" r="20" fill="#4E342E"/></svg>`,
            `<svg viewBox="0 0 100 100"><g fill="#FFF59D"><circle cx="50" cy="20" r="16"/><circle cx="50" cy="80" r="16"/><circle cx="20" cy="50" r="16"/><circle cx="80" cy="50" r="16"/><circle cx="28" cy="28" r="16"/><circle cx="72" cy="72" r="16"/><circle cx="28" cy="72" r="16"/><circle cx="72" cy="28" r="16"/></g><circle cx="50" cy="50" r="18" fill="#FFB300"/></svg>`,
            `<svg viewBox="0 0 100 100"><path d="M 75 85 Q 95 65 100 85 Q 85 95 75 85" fill="#66BB6A"/><g fill="#FFCA28"><circle cx="50" cy="20" r="16"/><circle cx="50" cy="80" r="16"/><circle cx="20" cy="50" r="16"/><circle cx="80" cy="50" r="16"/><circle cx="28" cy="28" r="16"/><circle cx="72" cy="72" r="16"/><circle cx="28" cy="72" r="16"/><circle cx="72" cy="28" r="16"/></g><circle cx="50" cy="50" r="20" fill="#3E2723"/></svg>`,
            `<svg viewBox="0 0 100 100"><g fill="#FFB300"><circle cx="50" cy="20" r="16"/><circle cx="50" cy="80" r="16"/><circle cx="20" cy="50" r="16"/><circle cx="80" cy="50" r="16"/><circle cx="28" cy="28" r="16"/><circle cx="72" cy="72" r="16"/><circle cx="28" cy="72" r="16"/><circle cx="72" cy="28" r="16"/></g><circle cx="50" cy="50" r="18" fill="#5D4037"/></svg>`
        ];

        // --- Configuración de Matter.js ---
        const Engine = Matter.Engine,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite;

        const engine = Engine.create();
        
        // Dimensiones del interior del frasco
        const JAR_WIDTH = 260;
        const JAR_HEIGHT = 380;
        const FLOWER_SIZE = 60;
        const FLOWER_RADIUS = 28; 

        // Crear límites invisibles del frasco (Paredes y suelo)
        const wallOptions = { isStatic: true, friction: 0.5, restitution: 0.1 };
        
        const leftWall = Bodies.rectangle(-10, JAR_HEIGHT/2, 20, JAR_HEIGHT + 200, wallOptions);
        const rightWall = Bodies.rectangle(JAR_WIDTH + 10, JAR_HEIGHT/2, 20, JAR_HEIGHT + 200, wallOptions);
        const floor = Bodies.rectangle(JAR_WIDTH/2, JAR_HEIGHT + 10, JAR_WIDTH, 20, wallOptions);
        
        // Añadir unas pequeñas cuñas en las esquinas inferiores
        const leftCorner = Bodies.rectangle(15, JAR_HEIGHT - 5, 40, 10, { isStatic: true, angle: Math.PI / 4 });
        const rightCorner = Bodies.rectangle(JAR_WIDTH - 15, JAR_HEIGHT - 5, 40, 10, { isStatic: true, angle: -Math.PI / 4 });

        Composite.add(engine.world, [leftWall, rightWall, floor, leftCorner, rightCorner]);

        const runner = Runner.create();
        Runner.run(runner, engine);

        // --- Sincronización entre físicas y el DOM ---
        const jarInside = document.getElementById('jarInside');
        const flowersData = []; 

        function renderDOM() {
            for (let i = 0; i < flowersData.length; i++) {
                const data = flowersData[i];
                const x = data.body.position.x - (FLOWER_SIZE / 2);
                const y = data.body.position.y - (FLOWER_SIZE / 2);
                const angle = data.body.angle;
                
                data.element.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`;
            }
            requestAnimationFrame(renderDOM);
        }
        requestAnimationFrame(renderDOM); 

        // --- Lógica del juego ---
        let flowerCount = 0;
        const MAX_FLOWERS = 60; 
        
        // MODIFICACIÓN: Reducido a 8 para que la nota aparezca muchísimo más rápido
        const FLOWERS_TO_SHOW_NOTE = 8; 
        let noteShown = false;
        let flowerInterval; 

        // Generar partículas de fondo
        const particlesContainer = document.getElementById('particles');
        for(let i = 0; i < 25; i++) {
            let dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.animationDelay = (Math.random() * 12) + 's';
            dust.style.animationDuration = (10 + Math.random() * 8) + 's';
            particlesContainer.appendChild(dust);
        }
        for(let i = 0; i < 15; i++) {
            let sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.animationDelay = (Math.random() * 5) + 's';
            sparkle.style.animationDuration = (2 + Math.random() * 4) + 's';
            particlesContainer.appendChild(sparkle);
        }

        // Generar flores automáticamente en bucle hasta llenar
        setTimeout(() => {
           flowerInterval = setInterval(() => {
               createFlower();
           }, 400); // Generar una flor cada 400ms
        }, 800); 

        function createFlower() {
            // 1. Crear elemento en el DOM
            const flowerEl = document.createElement('div');
            flowerEl.className = 'flower';
            flowerEl.innerHTML = flowerSVGs[Math.floor(Math.random() * flowerSVGs.length)];
            jarInside.appendChild(flowerEl);

            // 2. Crear cuerpo físico en Matter.js
            const randomX = (FLOWER_RADIUS) + Math.random() * (JAR_WIDTH - FLOWER_RADIUS * 2);
            
            const flowerBody = Bodies.circle(randomX, -50, FLOWER_RADIUS, {
                restitution: 0.3, 
                friction: 0.6,    
                density: 0.005    
            });

            // Añadir rotación inicial aleatoria
            Matter.Body.setAngle(flowerBody, Math.random() * Math.PI * 2);
            Matter.Body.setAngularVelocity(flowerBody, (Math.random() - 0.5) * 0.2);

            Composite.add(engine.world, flowerBody);

            // 3. Vincularlos en nuestro array
            flowersData.push({
                body: flowerBody,
                element: flowerEl
            });

            flowerCount++;

            // 4. Lógica de la Nota
            if (flowerCount === FLOWERS_TO_SHOW_NOTE && !noteShown) {
                setTimeout(showNoteCard, 300); 
            }

            // MODIFICACIÓN: Simplemente detener el intervalo al llenarse, sin cambiar el texto superior
            if (flowerCount >= MAX_FLOWERS) {
                clearInterval(flowerInterval); 
            }
        }

        function showNoteCard() {
            noteShown = true;
            document.getElementById('glow').classList.add('show');
            document.getElementById('noteCard').classList.add('show');
        }
    </script>
</body>
</html>
